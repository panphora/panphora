<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Likes banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ede2;
    --paper-glow: #f8e9d8;
    --paper-dot: rgb(42 36 30 / 0.08);
    --card: #fcf9f2;
    --field: #fffcf6;
    --line: #ddd4c3;
    --line-strong: #cfc4b0;
    --ink: #2a2520;
    --ink-on: #fbf4e8;
    --muted: #7a7266;
    --heart: #d9573b;
    --heart-ink: #8e3320;
    --heart-tint: #fbe4da;
    --heart-line: #efb9a5;
    --sky: #efdcc3;
    --sun: #eaa585;
    --cloud: #fbf2e4;
    --sage: #adbba3;
    --teal: #86a099;
    --sand: #e7d6b8;
    --sand-deep: #cdb48f;
    --shadow: rgb(70 46 24 / 0.38);
    --shadow-soft: rgb(42 36 30 / 0.07);
    --heart-shadow: rgb(217 87 59 / 0.28);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body {
    position: relative; color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    background:
      radial-gradient(460px 280px at 30% 62%, var(--paper-glow) 0%, transparent 72%),
      radial-gradient(1px 1px at 12px 12px, var(--paper-dot) 1px, transparent 1.6px) 0 0 / 24px 24px,
      var(--paper);
  }
  span, b { white-space: nowrap; }

  #card {
    position: absolute; left: 48px; top: 34px; width: 1240px; height: 330px;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px 0 0 0;
    box-shadow: 0 1px 2px var(--shadow-soft), 0 26px 46px -28px var(--shadow);
  }

  #card-head {
    position: absolute; left: 88px; top: 72px; width: 688px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #card-title { display: flex; align-items: center; gap: 20px; }
  .mark-icon { width: 64px; height: 64px; display: block; flex: none; }
  .mark-icon .m-tile { fill: var(--sand); }
  .mark-icon .m-page { fill: var(--card); }
  .mark-icon .m-line { fill: none; stroke: var(--sand-deep); stroke-width: 3; stroke-linecap: round; }
  .mark-icon .m-ribbon { fill: var(--heart); }
  #title {
    font-family: "Newsreader", Charter, Georgia, serif; font-size: 46px; font-weight: 540;
    letter-spacing: -0.5px; line-height: 1; font-variation-settings: "opsz" 60;
  }

  #like {
    height: 64px; padding: 0 28px 0 20px; display: inline-flex; align-items: center; gap: 14px;
    background: var(--heart-tint); border: 1.5px solid var(--heart-line); border-radius: 18px;
    color: var(--heart-ink); font-size: 24px; font-weight: 600; line-height: 1;
    box-shadow: 0 12px 22px -14px var(--heart-shadow);
  }
  #like .burst { position: relative; width: 36px; height: 36px; flex: none; }
  #like .ring { position: absolute; left: 50%; top: 50%; border: 2px solid var(--heart); border-radius: 50%; transform: translate(-50%, -50%); }
  #like .ring-a { width: 48px; height: 48px; opacity: 0.32; }
  #like .ring-b { width: 58px; height: 58px; opacity: 0.14; }
  .heart-icon { position: absolute; left: 2px; top: 2px; width: 32px; height: 32px; display: block; }
  .heart-icon .h-fill { fill: var(--heart); }

  #follow-form { position: absolute; left: 88px; top: 178px; display: flex; gap: 14px; }
  #email {
    width: 420px; height: 64px; padding: 0 20px; display: flex; align-items: center; gap: 14px;
    background: var(--field); border: 1.5px solid var(--line-strong); border-radius: 18px;
    color: var(--muted); font-size: 24px; line-height: 1;
  }
  .mail-icon { width: 28px; height: 28px; display: block; flex: none; }
  .mail-icon .mail-stroke { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #follow {
    height: 64px; padding: 0 28px 0 24px; display: inline-flex; align-items: center; gap: 12px;
    background: var(--ink); border-radius: 18px; color: var(--ink-on);
    font-size: 24px; font-weight: 600; line-height: 1;
    box-shadow: 0 12px 22px -14px var(--shadow);
  }
  .plus-icon { width: 22px; height: 22px; display: block; flex: none; }
  .plus-icon .plus-stroke { fill: none; stroke: var(--ink-on); stroke-width: 2.6; stroke-linecap: round; }

  #cover {
    position: absolute; left: 884px; top: 66px; width: 340px; height: 300px;
    border: 1px solid var(--line); border-radius: 18px 0 0 0; overflow: hidden;
  }
  .cover-art { width: 340px; height: 300px; display: block; }
  .cover-art .c-sky { fill: var(--sky); }
  .cover-art .c-sun { fill: var(--sun); }
  .cover-art .c-cloud { fill: var(--cloud); opacity: 0.7; }
  .cover-art .c-far { fill: var(--sage); }
  .cover-art .c-mid { fill: var(--teal); }
  .cover-art .c-near { fill: var(--sand-deep); }
</style>
</head>
<body>
  <div id="card">
  </div>

  <div id="card-head">
    <div id="card-title">
      <svg class="mark-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="m-tile" x="0" y="0" width="64" height="64" rx="16"/>
        <rect class="m-page" x="17" y="13" width="30" height="38" rx="5"/>
        <path class="m-line" d="M24 28h12M24 35h12M24 42h7"/>
        <path class="m-ribbon" d="M37 13h7v14l-3.5-2.8L37 27z"/>
      </svg>
      <span id="title">Weekend journal</span>
    </div>

    <div id="like">
      <span class="burst">
        <span class="ring ring-b"></span>
        <span class="ring ring-a"></span>
        <svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="h-fill" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
      <span>Like</span>
    </div>
  </div>

  <div id="follow-form">
    <div id="email">
      <svg class="mail-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect class="mail-stroke" x="3" y="5" width="18" height="14" rx="3"/>
        <path class="mail-stroke" d="M4 8l8 5.5L20 8"/>
      </svg>
      <span>Email address</span>
    </div>
    <div id="follow">
      <svg class="plus-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path class="plus-stroke" d="M12 4v16M4 12h16"/>
      </svg>
      <span>Follow project</span>
    </div>
  </div>

  <div id="cover">
    <svg class="cover-art" viewBox="0 0 340 300" aria-hidden="true">
      <rect class="c-sky" x="0" y="0" width="340" height="300"/>
      <circle class="c-sun" cx="238" cy="104" r="44"/>
      <ellipse class="c-cloud" cx="86" cy="86" rx="44" ry="9"/>
      <ellipse class="c-cloud" cx="128" cy="106" rx="30" ry="7"/>
      <path class="c-far" d="M0 168C60 138 110 128 170 152C230 176 280 150 340 130V300H0Z"/>
      <path class="c-mid" d="M0 206C70 178 130 190 190 206C250 222 300 196 340 186V300H0Z"/>
      <path class="c-near" d="M0 250C80 226 160 236 230 250C280 260 310 250 340 240V300H0Z"/>
    </svg>
  </div>
</body>
</html>
