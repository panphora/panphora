<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML Clay banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f3; --card: #fffefb; --line: #e7e3d8; --ink: #1b1a17; --muted: #6f6b62;
    --accent: #c2410c; --clay: #e8834d; --clay-deep: #c9622f; --chrome: #f1eee6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body {
    position: relative; color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif;
    background:
      radial-gradient(420px 260px at 18% 60%, #fdf1e6 0%, transparent 72%),
      radial-gradient(1px 1px at 12px 12px, rgb(27 26 23 / 0.08) 1px, transparent 1.6px) 0 0 / 24px 24px,
      var(--bg);
  }
  .mark { position: absolute; left: 38px; top: 58px; width: 188px; transform: rotate(-7deg); filter: drop-shadow(0 10px 14px rgb(194 65 12 / 0.18)); }

  .file { position: absolute; left: 238px; top: 60px; width: 186px; text-align: center; }
  .doc { position: relative; width: 98px; height: 124px; margin: 0 auto; }
  .doc svg { width: 100%; height: 100%; overflow: visible; }
  .doc .ext {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: 700 15px/1 ui-monospace, Menlo, monospace; color: #fffaf4; letter-spacing: 0.5px;
  }
  .doc .code { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); font: 700 26px/1 ui-monospace, Menlo, monospace; color: #fffaf4; }
  .ring { position: absolute; border: 2.5px solid var(--accent); border-radius: 50%; opacity: 0.55; }
  .r1 { width: 26px; height: 26px; left: 64px; top: 88px; }
  .r2 { width: 44px; height: 44px; left: 55px; top: 79px; opacity: 0.28; }
  .doc svg.pointer { position: absolute; left: 76px; top: 100px; width: 24px; height: 24px; }
  .file .name { white-space: nowrap; margin-top: 16px; font-size: 17px; font-weight: 500; color: var(--ink); background: #e9e3d6; border-radius: 6px; padding: 3px 8px; display: inline-block; }

  .arrow { position: absolute; left: 424px; top: 112px; width: 56px; }

  .window {
    position: absolute; left: 488px; top: 26px; width: 672px; height: 290px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px 12px 0 0;
    box-shadow: 0 2px 0 rgb(27 26 23 / 0.03), 0 26px 44px -26px rgb(80 44 20 / 0.4);
    overflow: hidden;
  }
  .bar { height: 46px; background: var(--chrome); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; }
  .bar i:nth-child(1) { background: #ec6a5e; } .bar i:nth-child(2) { background: #f4bf4f; } .bar i:nth-child(3) { background: #61c554; }
  .url { margin-left: 14px; flex: 1; height: 28px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; padding: 0 12px; gap: 8px; font-size: 16px; color: var(--muted); }
  .url b { color: var(--ink); font-weight: 500; }
  .saved { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px 0 10px; border-radius: 15px; background: #fbe7da; color: var(--accent); font-size: 17px; font-weight: 600; }
  .saved svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  .content { padding: 22px 34px; display: grid; grid-template-columns: 1fr 210px; gap: 26px; }
  h1 { font-size: 38px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.05; }
  ul { list-style: none; padding: 0; margin-top: 14px; font-size: 22px; line-height: 1.55; }
  li { display: flex; align-items: center; gap: 12px; }
  .box { width: 20px; height: 20px; border: 2px solid #c9c3b6; border-radius: 5px; flex: none; display: grid; place-items: center; }
  .box.on { background: var(--accent); border-color: var(--accent); }
  .box.on svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  li.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: rgb(111 107 98 / 0.6); }
  .edit { background: rgb(232 131 77 / 0.16); border-radius: 4px; padding: 0 3px; }
  .caret { display: inline-block; width: 2.5px; height: 24px; background: var(--accent); vertical-align: -4px; margin-left: 1px; }
  .note { margin-top: 6px; background: #fff7ec; border: 1px solid #f1dcc4; border-radius: 10px; padding: 14px 16px; font-size: 19px; line-height: 1.4; color: #5b4636; transform: rotate(1.5deg); }
  .note b { display: block; font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 4px; letter-spacing: 0.2px; }
</style>
</head>
<body>
  <img class="mark" src="assets/mark.svg" alt="">

  <div class="file">
    <div class="doc">
      <svg viewBox="0 0 98 124"><path d="M8 2h58l30 30v84a6 6 0 0 1-6 6H8a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" fill="#e8834d" stroke="#c9622f" stroke-width="2.5"/><path d="M66 2v24a6 6 0 0 0 6 6h24" fill="#f6b48c" stroke="#c9622f" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <span class="code">&lt;/&gt;</span>
      <span class="ring r2"></span><span class="ring r1"></span>
      <svg class="pointer" viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.6L10 19z" fill="#1b1a17" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div class="name">banana-bread.htmlclay</div>
  </div>

  <svg class="arrow" viewBox="0 0 70 40"><path d="M4 22c14-6 30-8 52-3" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/><path d="M46 8l14 11-15 9" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <div class="window">
    <div class="bar">
      <i></i><i></i><i></i>
      <div class="url"><b>banana-bread.htmlclay</b></div>
      <span class="saved"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Saved</span>
    </div>
    <div class="content">
      <div>
        <h1>Banana bread</h1>
        <ul>
          <li class="done"><span class="box on"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>3 ripe bananas</span></li>
          <li class="done"><span class="box on"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>1 stick butter, melted</span></li>
          <li><span class="box"></span><span><span class="edit">&frac12; cup</span> sugar<span class="caret"></span></span></li>
        </ul>
      </div>
      <div class="note"><b>Grandma's tip</b>Less sugar if the bananas are very ripe.</div>
    </div>
  </div>
</body>
</html>
