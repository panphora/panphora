  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body { position: relative; color: var(--ink); font-family: system-ui, -apple-system, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(520px 260px at 82% 30%, #2c3766 0%, transparent 70%), linear-gradient(160deg, #161b31 0%, #10142a 60%, #0c1022 100%); }
  svg.i { fill: currentColor; display: block; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #c9cdf0; opacity: .5; }

  .mark { position: absolute; left: 60px; top: 70px; display: flex; align-items: center; gap: 16px; }
  .mark svg { width: 64px; height: 64px; color: var(--ink); }
  .mark b { font: 700 60px/1 system-ui, -apple-system, sans-serif; letter-spacing: -.02em; }
  .line { position: absolute; left: 62px; top: 162px; width: 400px; font-size: 19px; line-height: 1.45; color: var(--muted); }

  .ui { position: absolute; inset: 0; transform: scale(1.45); transform-origin: 100% 0; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 20px; padding: 0 22px;
    background: rgb(22 25 44 / 0.7); border-bottom: 1px solid rgb(255 255 255 / 0.06); font-size: 13.5px; color: var(--ink); }
  .bar .dim { color: var(--muted); }
  .item { position: relative; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 5px; background: rgb(255 255 255 / 0.16); }
  .item svg { width: 18px; height: 18px; color: var(--sun); }
  .item span { font-weight: 600; font-variant-numeric: tabular-nums; }

  .menu { position: absolute; left: 862px; top: 34px; width: 330px; padding: 5px; border-radius: 10px; background: var(--menu);
    border: 1px solid rgb(255 255 255 / 0.1); box-shadow: 0 18px 40px rgb(0 0 0 / 0.45); font-size: 13.5px; }
  .row { height: 23px; display: flex; align-items: center; padding: 0 10px; border-radius: 5px; white-space: nowrap; }
  .row.state { font-weight: 600; gap: 8px; }
  .row.state svg { width: 16px; height: 16px; color: var(--sun); }
  .row.sub { padding-left: 34px; color: var(--muted); }
  .row.on { background: var(--hl); }
  .sep { height: 1px; margin: 5px 10px; background: rgb(255 255 255 / 0.1); }
</style>
