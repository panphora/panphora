<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doom Grid banner</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body { position: relative; background: #1a202c; color: #fff; font-family: "Libre Baskerville", serif; }
  h1 { position: absolute; left: 60px; top: 86px; font-size: 50px; line-height: 1; font-weight: 700; }
  h1 span { color: #ef4444; }
  p { position: absolute; left: 62px; top: 160px; width: 380px; font-size: 19px; line-height: 1.5; color: #e2e8f0; }
  p em { display: block; margin-top: 8px; font-size: 16px; color: #fcd34d; }
  .board { position: absolute; left: 500px; top: 0; width: 724px; }
</style>
</head>
<body>
  <h1><span>Doom</span>Grid</h1>
  <p>Invent board games with friends.<em>Fun awaits, delay not!</em></p>
  <img class="board" src="assets/board.png" alt="">
</body>
</html>
