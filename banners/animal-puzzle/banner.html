<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animal Puzzle Game banner</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body { position: relative; background: #e4f0fd; color: #1d3557; font-family: "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; }
  h1 { position: absolute; left: 60px; top: 80px; font-size: 48px; line-height: 1.05; font-weight: 800; color: #1d3a63; }
  p { position: absolute; left: 62px; top: 190px; width: 440px; font: 18px/1.45 system-ui, -apple-system, sans-serif; color: #4a6283; }

  .board { position: absolute; left: 560px; top: 24px; width: 312px; height: 262px; }
  .pc { position: absolute; width: 104px; height: 131px; background-image: url("assets/unicorn.jpg"); background-size: 312px 262px; }
  .slot { position: absolute; width: 104px; height: 131px; border: 2.5px dashed #9bb8dc; border-radius: 4px; background: rgb(255 255 255 / .35); }
  .fly { position: absolute; border: 5px solid #fff; box-shadow: 0 10px 22px -10px rgb(29 53 87 / .45); }
  .gir { width: 110px; height: 100px; background-image: url("assets/giraffe.jpg"); background-size: 220px 300px; }
</style>
</head>
<body>
  <h1>Animal Puzzle<br>Game</h1>
  <p>Catch the flying pieces and put the animal back together.</p>

  <div class="board" aria-hidden="true">
    <div class="pc" style="left:0;top:0;background-position:0 0"></div>
    <div class="pc" style="left:104px;top:0;background-position:-104px 0"></div>
    <div class="pc" style="left:208px;top:0;background-position:-208px 0"></div>
    <div class="pc" style="left:0;top:131px;background-position:0 -131px"></div>
    <div class="slot" style="left:104px;top:131px"></div>
    <div class="slot" style="left:208px;top:131px"></div>
  </div>

  <div class="pc fly" style="left:910px;top:120px;width:114px;height:141px;background-position:-104px -131px;background-size:312px 262px;transform:rotate(12deg);background-origin:border-box"></div>
  <div class="pc fly" style="left:1050px;top:22px;width:114px;height:141px;background-position:-208px -131px;transform:rotate(-14deg);background-origin:border-box"></div>
  <div class="fly gir" style="left:1080px;top:200px;background-position:-110px -100px;transform:rotate(22deg)"></div>
</body>
</html>
