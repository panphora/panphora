<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Malleable document spec banner</title>
<style>
  :root {
    --paper: #F1EFEA; --sheet: #FBFAF7; --ink: #2B2723; --ink-soft: #6E675E; --ink-faint: #9B948A;
    --line: #DDD8CE; --line-soft: #E7E3DA; --glaze: #3E6B52; --glaze-tint: #E4EBE2; --char: #2E2B27; --char-ink: #EDE7DB;
    --serif: Charter, "Bitstream Charter", Georgia, Cambria, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body { position: relative; background: var(--paper); color: var(--ink); font-family: var(--serif); }

  .mark { position: absolute; left: 60px; top: 58px; height: 36px; }
  .line { position: absolute; left: 60px; top: 122px; font: italic 400 40px/1.15 var(--serif); color: var(--glaze); letter-spacing: -.005em; }
  .sub { position: absolute; left: 60px; top: 190px; font: 16px/1.65 var(--mono); color: var(--ink-soft); }

  .win { position: absolute; left: 636px; top: 52px; width: 236px; height: 188px; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 0 var(--line); }
  .bar { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1.5px solid var(--line); }
  .bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .bar span { margin-left: 8px; font: 12.5px/1 var(--mono); color: var(--ink-soft); }
  .doc { padding: 16px 18px; }
  .doc h3 { font: 600 19px/1 var(--serif); margin-bottom: 14px; }
  .item { display: flex; align-items: center; gap: 10px; height: 28px; }
  .box { width: 16px; height: 16px; border: 1.5px solid var(--ink-faint); border-radius: 3px; flex: none; display: grid; place-items: center; }
  .box.on { background: var(--glaze); border-color: var(--glaze); }
  .box.on svg { width: 11px; height: 11px; fill: none; stroke: var(--sheet); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .bar2 { height: 8px; border-radius: 4px; background: var(--line); }
  .new { outline: 1.5px solid #B9CDB9; outline-offset: 2px; border-radius: 4px; background: var(--glaze-tint); }

  .flow { position: absolute; left: 872px; top: 52px; width: 112px; height: 188px; }
  .label { position: absolute; font: 12.5px/1 var(--mono); color: var(--ink-soft); white-space: nowrap; }
  .label b { color: var(--glaze); font-weight: 700; }

  .host { position: absolute; left: 984px; top: 70px; width: 170px; height: 152px; background: var(--char); color: var(--char-ink); border-radius: 10px; padding: 18px; box-shadow: 0 6px 0 var(--line); }
  .host .k { font: 12.5px/1 var(--mono); color: #A9A194; letter-spacing: .04em; }
  .host .r { margin-top: 12px; font: 700 14px/1.45 var(--mono); white-space: nowrap; }
  .host .file { position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid #4A4540; font: 13.5px/1 var(--mono); }
  .host .file svg { width: 20px; height: 24px; flex: none; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 470 76" aria-hidden="true">
    <g stroke-linejoin="round" stroke-linecap="round">
      <path d="M 13 4 H 42 L 58 20 V 61 C 52 70 44 74.5 35 72.5 C 28 71 24 66.5 18 67.5 C 13 68.5 8.5 66 6 60.5 L 6 11 Q 6 4 13 4 Z" fill="#FBFAF7" stroke="#2B2723" stroke-width="3.5"/>
      <path d="M 42 4 L 42 20 L 58 20 Z" fill="#3E6B52" stroke="#2B2723" stroke-width="3.5"/>
      <path d="M 16 30 H 45" stroke="#6E675E" stroke-width="4"/>
      <path d="M 16 42 H 37" stroke="#6E675E" stroke-width="4"/>
    </g>
    <text x="82" y="50" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="33" font-weight="700" letter-spacing="-0.5" fill="#2B2723">malleable<tspan fill="#3E6B52">document</tspan></text>
  </svg>
  <p class="line">HTML files that save themselves.</p>
  <p class="sub">The file is the app.<br>The DOM is the database.</p>

  <div class="win">
    <div class="bar"><i></i><i></i><i></i><span>notes.html</span></div>
    <div class="doc">
      <h3>Trip list</h3>
      <div class="item"><span class="box on"><svg viewBox="0 0 12 12"><path d="M2.5 6.3 5 8.6 9.6 3.6"/></svg></span><span class="bar2" style="width:96px"></span></div>
      <div class="item"><span class="box"></span><span class="bar2" style="width:122px"></span></div>
      <div class="item new"><span class="box"></span><span class="bar2" style="width:74px;background:#B9CDB9"></span></div>
    </div>
  </div>

  <div class="flow">
    <span class="label" style="left:12px;top:62px"><b>POST</b> /_/save</span>
    <svg width="120" height="188" viewBox="0 0 120 188" fill="none" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;inset:0">
      <path d="M8 86 H104" stroke="#3E6B52" stroke-width="2.5"/>
      <path d="M96 79 L105 86 L96 93" stroke="#3E6B52" stroke-width="2.5"/>
      <path d="M104 150 H12" stroke="#9B948A" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M20 143 L11 150 L20 157" stroke="#9B948A" stroke-width="2"/>
    </svg>
    <span class="label" style="left:18px;top:166px">serves it</span>
  </div>

  <div class="host">
    <div class="k">ANY HOST</div>
    <div class="r">one route<br>saves the bytes</div>
    <div class="file">
      <svg viewBox="0 0 64 76" aria-hidden="true"><g stroke-linejoin="round"><path d="M 13 4 H 42 L 58 20 V 61 C 52 70 44 74.5 35 72.5 C 28 71 24 66.5 18 67.5 C 13 68.5 8.5 66 6 60.5 L 6 11 Q 6 4 13 4 Z" fill="#EDE7DB" stroke="#EDE7DB" stroke-width="3.5"/><path d="M 42 4 L 42 20 L 58 20 Z" fill="#3E6B52" stroke="#EDE7DB" stroke-width="3.5"/></g></svg>
      notes.html
    </div>
  </div>
</body>
</html>
