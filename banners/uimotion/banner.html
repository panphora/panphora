<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uimotion banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #eef0fb; --bg-b: #e3e7f7; --ink: #1d2233; --muted: #7a8196; --line: #e3e6ef; --bar: #eceef4;
    --accent: #4b63e6; --accent-soft: #e6eafc; --code: #1e2232; --code-ink: #c9cee0; --code-dim: #79809a; --code-hl: rgb(124 142 255 / 0.2);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg-a); overflow: hidden; font-family: "Inter", system-ui, sans-serif; color: var(--ink); }
  .fit { width: 100%; height: 100%; }
  .fit-inner { width: 1200px; height: 300px; transform-origin: 0 0; }
  #stage:not([data-uimotion]) .later { visibility: hidden; }
  #stage { position: relative; width: 1200px; height: 300px; overflow: hidden; background: linear-gradient(120deg, var(--bg-a), var(--bg-b)); }

  .code {
    position: absolute; left: 32px; top: 26px; width: 432px; height: 248px; padding: 22px 0; background: var(--code); border-radius: 14px;
    box-shadow: 0 18px 36px -20px rgb(29 34 51 / 0.55); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 20px; color: var(--code-ink);
  }
  .ln { position: relative; height: 34px; line-height: 34px; padding: 0 26px; white-space: pre; }
  .hl { position: absolute; inset: 0 10px; border-radius: 7px; background: var(--code-hl); }
  .ln span { position: relative; }
  .m { color: #9fb0ff; }
  .s { color: #f2c38b; }
  .d { color: var(--code-dim); }

  #app {
    position: absolute; left: 498px; top: 26px; width: 670px; height: 248px; background: #fff; border-radius: 12px;
    border: 1px solid var(--line); box-shadow: 0 1px 2px rgb(29 34 51 / 0.05), 0 18px 36px -24px rgb(29 34 51 / 0.35);
  }
  .top { height: 58px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 18px; }
  .doc-ic { width: 22px; height: 26px; border-radius: 4px; background: var(--accent-soft); border: 1.5px solid #b9c3f5; }
  .title { font-size: 19px; font-weight: 600; }
  .grow { flex: 1; }
  .faces { display: flex; }
  .faces i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px; }
  .faces i:nth-child(1) { background: #f2b48b; } .faces i:nth-child(2) { background: #9ed2b5; }
  #share { height: 36px; padding: 0 18px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; }
  .body { padding: 22px 26px; }
  .body .h { width: 46%; height: 18px; border-radius: 5px; background: #dfe2ec; margin-bottom: 18px; }
  .body .p { height: 11px; border-radius: 6px; background: var(--bar); margin-top: 13px; }

  #menu {
    position: absolute; right: 16px; top: 66px; width: 248px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 26px rgb(29 34 51 / 0.14); transform-origin: 100% 0; z-index: 2;
  }
  .item { position: relative; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 17px; font-weight: 500; }
  .item svg { position: relative; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item span { position: relative; }
  #hover { position: absolute; inset: 0; border-radius: 7px; background: #f0f2f8; }

  #toast {
    position: absolute; left: 50%; bottom: 20px; margin-left: -88px; width: 176px; height: 44px; border-radius: 22px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 17px; font-weight: 600; box-shadow: 0 10px 22px -8px rgb(29 34 51 / 0.5); z-index: 3;
  }
  #toast svg { width: 18px; height: 18px; stroke: #8fe0a8; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .uimotion-cursor svg { filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.25)); }
</style>
</head>
<body>
<div class="fit"><div class="fit-inner">
<div id="stage">
  <div class="code" aria-hidden="true">
    <div class="ln"><b class="hl later" id="h1"></b><span><span class="m">scene</span>(<span class="s">'#doc'</span>)</span></div>
    <div class="ln"><b class="hl later" id="h2"></b><span>  .<span class="m">click</span>(<span class="s">'#share'</span>)</span></div>
    <div class="ln"><b class="hl later" id="h3"></b><span>  .<span class="m">pop</span>(<span class="s">'#menu'</span>)</span></div>
    <div class="ln"><b class="hl later" id="h4"></b><span>  .<span class="m">click</span>(<span class="s">'#copy-link'</span>)</span></div>
    <div class="ln"><b class="hl later" id="h5"></b><span>  .<span class="m">rise</span>(<span class="s">'#toast'</span>)</span></div>
    <div class="ln"><b class="hl later" id="h6"></b><span>  .<span class="m">reset</span>()</span></div>
  </div>

  <div id="app" aria-hidden="true">
    <div class="top">
      <span class="doc-ic"></span><span class="title">Launch notes</span><span class="grow"></span>
      <span class="faces"><i></i><i></i></span>
      <div id="share">Share</div>
    </div>
    <div class="body">
      <div class="h"></div>
      <div class="p" style="width:92%"></div><div class="p" style="width:84%"></div><div class="p" style="width:88%"></div><div class="p" style="width:60%"></div>
    </div>
    <div id="menu" class="later">
      <div class="item"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8v6M14 11h6"/></svg><span>Invite people</span></div>
      <div class="item" id="copy-link"><b id="hover" class="later"></b><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Copy link</span></div>
      <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg><span>Publish to web</span></div>
    </div>
    <div id="toast" class="later"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Link copied</div>
  </div>
</div>
</div></div>

<script type="module">
import { scene } from './assets/uimotion.js'

const fit = document.querySelector('.fit')
const inner = document.querySelector('.fit-inner')
const resize = () => { inner.style.transform = `scale(${fit.clientWidth / 1200})` }
resize()
addEventListener('resize', resize)

const on = id => [id, 'opacity', 1, { from: 0, duration: 0, ease: 'linear' }]
const rest = [1120, 250]

const s = scene('#stage', { cursor: rest })
  .tween(...on('#h1'))
  .wait(900)
  .set('#h1', { opacity: 0 })
  .with().tween(...on('#h2'))
  .with().move('#share', { duration: 700 })
  .click('#share')
  .with(285).set('#h2', { opacity: 0 })
  .with().tween(...on('#h3'))
  .with().pop('#menu', { from: 0.96 })
  .wait(700)
  .set('#h3', { opacity: 0 })
  .with().tween(...on('#h4'))
  .with().move('#copy-link', { offset: [0.42, 0.55], duration: 450 })
  .with(330).tween('#hover', 'opacity', 1, { from: 0, duration: 120, ease: 'linear' })
  .wait(300)
  .click('#copy-link', { offset: [0.42, 0.55] })
  .with(285).tween('#menu', 'opacity', 0, { duration: 160, ease: 'linear' })
  .with(160).set('#h4', { opacity: 0 })
  .with().tween(...on('#h5'))
  .with().rise('#toast', { fade: 0 })
  .wait(1500)
  .tween('#toast', 'opacity', 0, { duration: 200, ease: 'linear' })
  .with(200).set('#h5', { opacity: 0 })
  .with().tween(...on('#h6'))
  .with().move(rest, { duration: 700 })
  .wait(700)
  .reset()

const t = new URLSearchParams(location.search).get('t')
if (t != null) s.seek(Number(t))
else s.play()
if (new URLSearchParams(location.search).has('debug')) s.debug()
window.uimotionScene = s
</script>
</body>
</html>
