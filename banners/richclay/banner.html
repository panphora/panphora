<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rich Clay banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --surface: #fcfbf8; --surface-alt: #efece5; --border: #d4cfc4;
    --text: #1e2024; --muted: #6b6a66; --accent: #8c4a27; --accent-tint: rgb(217 138 95 / 0.28);
    --code-bg: #1d1e22; --code-line: #33363d; --code-text: #d9d4c9; --code-tag: #d98a5f; --code-attr: #9fb7cf; --code-dim: #7d7a74;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body {
    position: relative; color: var(--text);
    background:
      repeating-linear-gradient(0deg, transparent 0 35px, rgb(30 32 36 / 0.035) 35px 36px),
      var(--bg);
    font-family: "Newsreader", Charter, Georgia, serif;
  }
  .page {
    position: absolute; left: 44px; top: 34px; width: 712px; height: 300px;
    background: var(--surface); border: 1px solid var(--border); border-bottom: 0;
    border-radius: 10px 10px 0 0; box-shadow: 0 1px 3px rgb(30 32 36 / 0.06), 0 22px 40px -26px rgb(60 40 20 / 0.35);
    padding: 34px 46px;
  }
  h1 { font-weight: 560; font-size: 40px; letter-spacing: -0.4px; line-height: 1.1; font-variation-settings: "opsz" 60; }
  p { margin-top: 76px; font-size: 29px; line-height: 1.42; color: #2a2c31; }
  p em { font-style: italic; }
  .sel { background: var(--accent-tint); border-radius: 3px; box-shadow: 0 0 0 2px var(--accent-tint); }
  .sel strong { font-weight: 600; }
  .caret { display: inline-block; width: 2.5px; height: 31px; background: var(--accent); vertical-align: -5px; margin-left: 1px; }
  .toolbar {
    position: absolute; left: 217px; top: 132px; display: flex; align-items: center; gap: 3px; padding: 5px;
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 10px 22px -10px rgb(30 32 36 / 0.35), 0 1px 2px rgb(30 32 36 / 0.08);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #2a2c31;
  }
  .toolbar::after {
    content: ""; position: absolute; left: 134px; bottom: -7px; width: 12px; height: 12px; transform: rotate(45deg);
    background: var(--surface-alt); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .b { width: 40px; height: 38px; display: grid; place-items: center; border-radius: 5px; border: 1px solid transparent; font-size: 21px; }
  .b.on { background: rgb(30 32 36 / 0.1); border-color: rgb(30 32 36 / 0.22); box-shadow: inset 0 1px 2px rgb(30 32 36 / 0.14); }
  .b svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; align-self: stretch; margin: 5px 4px; background: var(--border); }
  .code {
    position: absolute; left: 790px; top: 46px; width: 366px; height: 206px;
    background: var(--code-bg); border-radius: 10px; border: 1px solid #2b2d33;
    box-shadow: 0 22px 40px -24px rgb(20 14 8 / 0.55);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 19px; line-height: 1.55; color: var(--code-text);
    padding: 20px 22px; overflow: hidden;
  }
  .code .dots { display: flex; gap: 7px; margin-bottom: 14px; }
  .code .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--code-line); }
  .t { color: var(--code-tag); } .a { color: var(--code-attr); } .d { color: var(--code-dim); }
  .hl { background: rgb(217 138 95 / 0.18); border-radius: 3px; }
  .ind { padding-left: 22px; }
  .arrow { position: absolute; left: 756px; top: 136px; width: 36px; height: 30px; }
</style>
</head>
<body>
  <div class="page">
    <h1>Keeping a commonplace book</h1>
    <p>Write down what <span class="sel"><strong>surprises</strong></span> you while you are still surprised<span class="caret"></span></p>
  </div>
  <div class="toolbar" aria-hidden="true">
    <span class="b on" style="font-weight:700">B</span>
    <span class="b" style="font-style:italic;font-family:Newsreader,serif;font-size:23px">I</span>
    <span class="b"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>
    <span class="sep"></span>
    <span class="b" style="font-weight:650;font-size:19px">H2</span>
    <span class="b"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></span>
    <span class="b" style="font-family:Newsreader,serif;font-size:34px;line-height:0;padding-top:16px">&ldquo;</span>
  </div>
  <div class="code" aria-hidden="true">
    <div class="dots"><i></i><i></i><i></i></div>
    <div><span class="t">&lt;article</span> <span class="a">class</span>=<span class="d">"entry"</span><span class="t">&gt;</span></div>
    <div class="ind"><span class="t">&lt;p&gt;</span>Write down what</div>
    <div class="ind"><span class="hl"><span class="t">&lt;strong&gt;</span>surprises<span class="t">&lt;/strong&gt;</span></span></div>
    <div class="ind">you while you are&hellip;<span class="t">&lt;/p&gt;</span></div>
    <div><span class="t">&lt;/article&gt;</span></div>
  </div>
</body>
</html>
