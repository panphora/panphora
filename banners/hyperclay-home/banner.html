<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New hyperclay.com homepage banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFF1F4; --surface: #F7F8FA; --grid: #E0E4EA; --hairline: #C9CFD8; --ink: #232B36; --ink-soft: #5C6675;
    --amber: #D98E2B; --amber-deep: #8F5A10; --amber-glow: #F7E3BF; --goo: #D98E2B;
    --mono: "IBM Plex Mono", ui-monospace, monospace; --sans: "Inter", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body {
    position: relative; color: var(--ink); font-family: var(--sans);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--paper);
  }
  .logo { position: absolute; left: 50px; top: 24px; height: 52px; }
  .logo-goo { position: absolute; left: 34px; top: 24px; width: 60px; height: 52px; overflow: visible; }
  h1 { position: absolute; left: 44px; top: 88px; width: 520px; font-family: var(--mono); font-weight: 400; font-size: 42px; line-height: 1.12; letter-spacing: -0.03em; }
  .nos { position: absolute; left: 44px; top: 210px; display: flex; gap: 18px; padding: 10px 18px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--surface); font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--ink); }

  .show { position: absolute; left: 620px; top: 52px; width: 540px; height: 222px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 14px; padding: 20px 22px; box-shadow: 6px 6px 0 var(--ink); }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar .name { font-family: var(--mono); font-size: 18px; font-weight: 600; }
  .grow { flex: 1; }
  .live { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--amber-glow); color: var(--amber-deep); font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px rgb(217 142 43 / 0.25); }
  .row { position: relative; height: 40px; display: grid; grid-template-columns: 26px 1fr 110px; align-items: center; gap: 12px; padding: 0 12px; border: 1px solid var(--hairline); border-radius: 8px; background: #fff; margin-top: 8px; font-size: 17px; }
  .row .grip { width: 12px; height: 18px; background: radial-gradient(circle, #a9b1bd 1.6px, transparent 1.8px) 0 0 / 6px 6px; }
  .tag { justify-self: end; height: 24px; padding: 0 10px; border-radius: 12px; font-family: var(--mono); font-size: 13px; display: flex; align-items: center; }
  .t1 { background: #e3f1e6; color: #2f6b3e; } .t2 { background: #e6ecf7; color: #3b5784; } .t3 { background: var(--amber-glow); color: var(--amber-deep); }
  .row.lift { transform: translate(14px, -6px) rotate(-1.2deg); border-color: var(--ink); box-shadow: 0 12px 20px -10px rgb(35 43 54 / 0.45); z-index: 2; }
  .slot { height: 40px; margin-top: 8px; border: 1.5px dashed var(--hairline); border-radius: 8px; position: absolute; left: 22px; right: 22px; top: 162px; }
  .hand { position: absolute; left: 670px; top: 220px; width: 34px; height: 34px; z-index: 5; }

  .goo { position: absolute; left: 1040px; top: 10px; width: 80px; height: 49px; color: var(--goo); z-index: 3; }
  .goo svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
