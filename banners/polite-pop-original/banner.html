<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polite Pop banner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body { position: relative; background: #fff8ea; color: #1e2433; font-family: "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .logo { position: absolute; left: 60px; top: 76px; height: 62px; }
  p { position: absolute; left: 62px; top: 160px; width: 430px; font-size: 20px; line-height: 1.45; color: #3a4255; }

  .page { position: absolute; left: 560px; top: 30px; width: 600px; height: 300px; padding: 30px 40px; background: #121a2e; border-radius: 16px 16px 0 0; }
  .page h2 { font: 600 22px/1.2 Georgia, serif; color: #fff; }
  .bar { height: 10px; margin-top: 15px; border-radius: 5px; background: #2b3550; }
  .pop { position: absolute; left: 596px; top: 92px; width: 330px; filter: drop-shadow(0 16px 26px rgb(0 0 0 / .35)); }
</style>
</head>
<body>
  <img class="logo" src="assets/logo.png" alt="Polite Pop">
  <p>Get high-quality email subscribers by asking at the right time and in the right way.</p>

  <div class="page" aria-hidden="true">
    <h2>Solving the biggest obstacle</h2>
    <div class="bar" style="width:92%"></div><div class="bar" style="width:86%"></div><div class="bar" style="width:95%"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:60%"></div>
  </div>
  <img class="pop" src="assets/pop.png" alt="">
</body>
</html>
