<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pie Rush banner</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 300px; overflow: hidden; }
  body { position: relative; background: #3c87a3 url("assets/game.png") center / 1200px 300px no-repeat; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  body::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(14 46 66 / 0.55) 0%, rgb(14 46 66 / 0.3) 38%, transparent 58%); }
  h1 { position: absolute; left: 58px; top: 70px; font-size: 72px; line-height: 1; font-weight: 900; color: #ffd23e; letter-spacing: 3px;
    text-shadow: 0 5px 0 rgba(0,0,0,.5), 0 0 40px rgba(255, 210, 62, .25); }
  p { position: absolute; left: 60px; top: 168px; width: 420px; font-size: 21px; line-height: 1.35; font-weight: 700; color: #9fe7a9; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
</style>
</head>
<body>
  <h1>PIE RUSH</h1>
  <p>Build a pie empire together, and guard it from the raccoons.</p>
</body>
</html>
