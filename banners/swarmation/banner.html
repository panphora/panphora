<style>

  .px i.self { background: #66dddd; }
  .card { position: absolute; right: 30px; top: 26px; width: 88px; height: 88px; padding: 18px; background: #fff; border: 1px solid #8ca2ad; border-radius: 3px; box-shadow: rgba(0,36,62,.2) 2px 2px 0; }
  .card div { position: relative; }
  .card i { position: absolute; width: 8px; height: 8px; background: #ffbb33; box-shadow: inset -1px -1px 0 rgba(0,36,62,.2), inset 1px 1px 0 rgba(255,255,255,.4); }
  .card span { position: absolute; left: 0; right: 0; top: 94px; text-align: center; font-weight: 700; font-size: 15px; }
  .tip { position: absolute; left: 909px; top: 62px; transform: translate(-50%, -100%); padding: 5px 11px; background: #fff; border: 1px solid #8ca2ad; border-radius: 3px; box-shadow: rgba(0,36,62,.2) 2px 2px 0; font-size: 14px; white-space: nowrap; }
</style>
